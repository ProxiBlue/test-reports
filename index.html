<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Reports</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 0.5rem; }
        .subtitle { color: #8b949e; margin-bottom: 2rem; }
        .site-section { margin-bottom: 2rem; }
        .site-section h2 { color: #f0f6fc; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #21262d; }
        .report-list { list-style: none; }
        .report-list li { margin-bottom: 0.5rem; }
        .report-list a { color: #58a6ff; text-decoration: none; padding: 0.5rem 1rem; display: inline-block; background: #161b22; border: 1px solid #30363d; border-radius: 6px; transition: border-color 0.2s; }
        .report-list a:hover { border-color: #58a6ff; }
        .report-meta { color: #8b949e; font-size: 0.85rem; margin-left: 0.5rem; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem; }
        .badge-admin { background: #1f6feb33; color: #58a6ff; }
        .badge-hyva { background: #23863633; color: #3fb950; }
        .badge-lcd { background: #9e6a0333; color: #d29922; }
        .badge-default { background: #30363d; color: #8b949e; }
        .empty { color: #8b949e; font-style: italic; }
        .all-pass { color: #3fb950; }
        footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #21262d; color: #484f58; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Reports</h1>
        <p class="subtitle">Playwright test results. Only fully successful runs on live branch are published.</p>

        <div id="reports"></div>

        <footer>
            <p>Reports published automatically after successful test runs. Each report contains pass/fail details, traces, and screenshots.</p>
        </footer>
    </div>

    <script>
        fetch('reports.json')
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('reports');
                const sites = Object.keys(data).sort();

                if (sites.length === 0) {
                    container.innerHTML = '<p class="empty">No reports published yet.</p>';
                    return;
                }

                sites.forEach(site => {
                    const section = document.createElement('div');
                    section.className = 'site-section';

                    const runs = data[site].sort((a, b) => b.date.localeCompare(a.date));
                    const listItems = runs.map(run => {
                        const badges = (run.suites || []).map(s =>
                            `<span class="badge badge-${s}">${s}</span>`
                        ).join('');
                        const stats = run.passed !== undefined
                            ? `<span class="all-pass">${run.passed} passed</span>`
                            : '';
                        const commit = run.commit
                            ? `<span class="report-meta">${run.commit}</span>`
                            : '';
                        return `<li>
                            <a href="${run.path}">${run.date}</a>
                            ${badges} ${stats} ${commit}
                        </li>`;
                    }).join('');

                    section.innerHTML = `
                        <h2>${site}</h2>
                        <ul class="report-list">${listItems}</ul>
                    `;
                    container.appendChild(section);
                });
            })
            .catch(() => {
                document.getElementById('reports').innerHTML =
                    '<p class="empty">Could not load reports index.</p>';
            });
    </script>
</body>
</html>
